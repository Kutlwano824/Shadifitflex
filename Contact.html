<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Contact ShadiFitFlex for customer support, order questions, and ambassador enquiries.">
    <link rel="stylesheet" href="CSS/style.css">
    <script src="Java script/catalog.js" defer></script>
    <title>ShadiFitFlex | Contact Support</title>
</head>

<body>

    <header class="site-header">
        <h1>ShadiFitFlex</h1>

        <nav class="site-nav" aria-label="Main navigation">
            <img class="logo" src="images/logo1.png" alt="ShadiFitFlex logo">
            <a href="index.html">Home</a> |
            <a href="About.html">About Us</a> |
            <a href="Products.html">Products</a> |
            <a href="Enquiry.html">Enquiry</a> |
            <a href="Contact.html">Contact</a>
        </nav>
    </header>

    <main class="site-main">

        <h2>Contact Us</h2>

        <p>
            <strong>Business Name:</strong> ShadiFitFlex
        </p>

        <p>
            <strong>Location:</strong> South Africa
        </p>

        <p>
            <strong>Email:</strong> info@shadifitflex.co.za
        </p>

        <p>
            <strong>Website:</strong> www.shadifitflex.co.za
        </p>

        <h3>Send Us a Message</h3>

        <form id="contact-form" class="stacked-form" novalidate>

            <div class="field-group">
                <label for="contact-name">Full Name:</label>
                <input type="text" id="contact-name" name="contact-name">
                <span id="contact-name-error" class="error-message" aria-live="polite"></span>
            </div>

            <div class="field-group">
                <label for="contact-email">Email:</label>
                <input type="email" id="contact-email" name="contact-email">
                <span id="contact-email-error" class="error-message" aria-live="polite"></span>
            </div>

            <div class="field-group">
                <label for="contact-subject">Message Type:</label>
                <select id="contact-subject" name="contact-subject">
                    <option value="">Select a subject</option>
                    <option value="General enquiry">General enquiry</option>
                    <option value="Order support">Order support</option>
                    <option value="Product question">Product question</option>
                    <option value="Ambassador enquiry">Ambassador enquiry</option>
                </select>
                <span id="contact-subject-error" class="error-message" aria-live="polite"></span>
            </div>

            <div class="field-group">
                <label for="contact-message">Message:</label>
                <textarea id="contact-message" name="contact-message" rows="7"></textarea>
                <span id="contact-message-error" class="error-message" aria-live="polite"></span>
            </div>

            <div id="contact-message-output" class="form-feedback hidden" aria-live="polite"></div>

            <div class="form-buttons">
                <input type="submit" value="Send Message">
            </div>

        </form>

    </main>

    <footer class="site-footer">
        <p>&copy; 2026 ShadiFitFlex. All rights reserved.</p>
    </footer>

</body>
</html>
